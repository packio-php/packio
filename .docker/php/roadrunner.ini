; PHP worker stdout is reserved for the Goridge protocol. Diagnostics belong on stderr.
display_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = Off
