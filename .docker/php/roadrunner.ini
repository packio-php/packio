; PHP worker stdout is reserved for the Goridge protocol. Diagnostics belong on stderr.
display_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = Off

; The application does not change PHP session settings; the session cookie in config/autoload/session.global.php lives 7200 seconds.
session.save_handler = files
session.save_path = /app/data/sessions
session.gc_maxlifetime = 7200
session.gc_probability = 1
session.gc_divisor = 100
