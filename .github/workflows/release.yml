name: Release bundle preparation

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag, or full commit SHA to prepare
        required: true
        type: string
      verification_run_id:
        description: Successful Public verification run for that exact commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare immutable preview bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      bundle_digest: ${{ steps.upload.outputs.artifact-digest }}
    permissions:
      contents: read
      actions: read
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      VERSION_POLICY: ${{ vars.VERSION_POLICY }}
      RELEASE_OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}
    steps:
      - name: Check the requested ref and repository settings
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          GH_OWNER: ${{ vars.RELEASE_OWNER_LOGIN }}
          GH_ACTOR: ${{ github.actor }}
          GH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_RUN_ID: ${{ inputs.verification_run_id }}
          GH_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ["GH_REPOSITORY"]
          owner = os.environ["GH_OWNER"]
          run_id = os.environ["GH_RUN_ID"]
          namespace = os.environ["DOCKERHUB_NAMESPACE"]
          policy = os.environ["VERSION_POLICY"]
          if repo != "packio-php/packio":
              raise SystemExit("release preparation is limited to packio-php/packio")
          if namespace != "sirix777" or policy != "native-semver":
              raise SystemExit("required Docker Hub namespace or native SemVer policy is missing")
          if not owner or not re.fullmatch(r"[A-Za-z0-9-]{1,39}", owner):
              raise SystemExit("RELEASE_OWNER_LOGIN must name the configured owner")
          launch_actor = os.environ.get("GH_ACTOR", "")
          triggering_actor = os.environ.get("GH_TRIGGERING_ACTOR", "")
          if (launch_actor.casefold() != owner.casefold()
                  or triggering_actor.casefold() != owner.casefold()):
              raise SystemExit("only RELEASE_OWNER_LOGIN may launch or rerun release preparation")
          if not re.fullmatch(r"[0-9]+", run_id):
              raise SystemExit("verification_run_id must be a numeric Actions run ID")

          base = os.environ["GH_API_URL"].rstrip("/") + "/repos/" + repo
          token = os.environ["GH_TOKEN"]

          def get(path):
              request = urllib.request.Request(base + path, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          actor_request = urllib.request.Request(
              os.environ["GH_API_URL"].rstrip("/") + "/users/" + urllib.parse.quote(owner, safe=""),
              headers={"Accept": "application/vnd.github+json",
                       "Authorization": "Bearer " + token,
                       "X-GitHub-Api-Version": "2022-11-28"})
          with urllib.request.urlopen(actor_request, timeout=30) as response:
              actor = json.load(response)
          if (actor.get("login", "").casefold() != owner.casefold()
                  or actor.get("login", "").casefold() != launch_actor.casefold()
                  or actor.get("login", "").casefold() != triggering_actor.casefold()):
              raise SystemExit("configured release owner could not be resolved")
          environment = get("/environments/release-approval")
          rules = environment.get("protection_rules", [])
          reviewer_rules = [rule for rule in rules if rule.get("type") == "required_reviewers"]
          if len(reviewer_rules) != 1:
              raise SystemExit("release-approval must have one required-reviewers rule")
          reviewers = reviewer_rules[0].get("reviewers", [])
          reviewer = reviewers[0].get("reviewer", {}) if len(reviewers) == 1 else {}
          if (len(reviewers) != 1 or reviewers[0].get("type") != "User"
                  or reviewer.get("id") != actor.get("id")
                  or reviewer.get("login", "").casefold() != actor.get("login", "").casefold()):
              raise SystemExit("release-approval must require only RELEASE_OWNER_LOGIN")
          if reviewer_rules[0].get("prevent_self_review") is not False:
              raise SystemExit("release-approval must allow its sole owner to approve their manual preview")
          if environment.get("can_admins_bypass") is not False:
              raise SystemExit("release-approval must disable administrator bypass")

          run = get("/actions/runs/" + run_id)
          if (run.get("id") != int(run_id)
                  or type(run.get("run_attempt")) is not int or run["run_attempt"] < 1
                  or run.get("repository", {}).get("full_name") != repo
                  or run.get("head_repository", {}).get("full_name") != repo
                  or run.get("event") not in {"push", "workflow_dispatch"}
                  or run.get("status") != "completed" or run.get("conclusion") != "success"):
              raise SystemExit("verification run must be a successful same-repository non-PR run")
          path = run.get("path", "")
          if path != ".github/workflows/verify.yml" and not path.startswith(
                  ".github/workflows/verify.yml@refs/heads/") and not path.startswith(
                  ".github/workflows/verify.yml@refs/tags/"):
              raise SystemExit("verification run did not use .github/workflows/verify.yml")
          jobs = get("/actions/runs/" + run_id + "/jobs?per_page=100")
          artifacts = get("/actions/runs/" + run_id + "/artifacts?per_page=100")
          rows = jobs.get("jobs", [])
          by_name = {job.get("name"): job for job in rows}
          required_jobs = {
              "backend (base)": ("composer audit --locked", "Validate and audit locked tools",
                                 "composer check && composer openapi-check"),
              "backend (concurrency)": ("composer test:concurrency",),
              "frontend": ("npm audit && npm ls", "npm run check"),
              "Scan checkout and selected publication history": (
                  "Verify frozen refs and scan with pinned native Gitleaks",),
              "Runtime images and private Composer product": (
                  "Require Docker and verify production images, layers and startup",
                  "Verify real production SSR and proxy browser contract",
                  "Require private Composer install and tenant isolation"),
          }
          for name, fragments in required_jobs.items():
              job = by_name.get(name)
              if not job or job.get("status") != "completed" or job.get("conclusion") != "success":
                  raise SystemExit("verification is missing a successful required job")
              steps = job.get("steps", [])
              for fragment in fragments:
                  matched = [step for step in steps if fragment in step.get("name", "")]
                  if len(matched) != 1 or matched[0].get("status") != "completed" or matched[0].get("conclusion") != "success":
                      raise SystemExit("verification is missing a successful required step")
          matches = [item for item in artifacts.get("artifacts", [])
                     if item.get("name") == "verified-runtime-images"]
          if (len(matches) != 1 or matches[0].get("expired") is not False
                  or not re.fullmatch(r"sha256:[0-9a-f]{64}", matches[0].get("digest", ""))):
              raise SystemExit("verification run lacks its intact runtime image artifact")
          snapshot = {"run": run, "jobs": jobs, "artifacts": artifacts}
          Path(os.environ["RUNNER_TEMP"], "release-preflight.json").write_text(
              json.dumps(snapshot, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("candidate_sha=" + run["head_sha"] + "\n")
              output.write("artifact_id=" + str(matches[0]["id"]) + "\n")
              output.write("artifact_digest=" + matches[0]["digest"] + "\n")
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the selected ref once and bind it to verification
        id: candidate
        env:
          EXPECTED_SHA: ${{ steps.check.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$sha" = "$EXPECTED_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Configure the same Docker image store as verification
        uses: docker/setup-docker-action@v5
        with:
          version: v29.9.0
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - name: Download the bound verification artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.check.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ steps.check.outputs.artifact_digest }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path, PurePosixPath
          import stat
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          artifact_id = os.environ["ARTIFACT_ID"]
          if not artifact_id.isdigit():
              raise SystemExit("invalid artifact id")
          repo = os.environ["GH_REPOSITORY"]
          base = os.environ["GH_API_URL"].rstrip("/") + "/repos/" + repo
          request = urllib.request.Request(base + "/actions/artifacts/" + artifact_id + "/zip",
              headers={"Accept": "application/vnd.github+json",
                       "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "X-GitHub-Api-Version": "2022-11-28"})
          class SafeArtifactRedirect(urllib.request.HTTPRedirectHandler):
              allowed_hosts = {"github.com", "objects.githubusercontent.com",
                               "release-assets.githubusercontent.com"}

              def redirect_request(self, req, fp, code, msg, headers, new_url):
                  parsed = urllib.parse.urlsplit(new_url)
                  hostname = (parsed.hostname or "").lower()
                  azure_blob = re.fullmatch(
                      r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.blob\.core\.windows\.net",
                      hostname) is not None
                  allowed_host = hostname in self.allowed_hosts or azure_blob
                  if (parsed.scheme != "https" or not allowed_host or parsed.port not in (None, 443)
                          or parsed.username is not None or parsed.password is not None):
                      raise SystemExit("verification artifact redirect host is not allowed")
                  # A redirect is a separate unauthenticated artifact-storage request.
                  return urllib.request.Request(new_url)

          no_redirect = urllib.request.build_opener(SafeArtifactRedirect())
          try:
              response = no_redirect.open(request, timeout=30)
          except urllib.error.HTTPError as error:
              raise SystemExit("verification artifact download was rejected") from None
          archive_path = Path("evidence/verified-runtime-images.zip")
          archive_path.parent.mkdir(parents=True, exist_ok=True)
          digest = hashlib.sha256()
          size = 0
          with archive_path.open("xb") as output:
              while chunk := response.read(1024 * 1024):
                  size += len(chunk)
                  if size > 2_000_000_000:
                      raise SystemExit("verification artifact exceeds the allowed size")
                  digest.update(chunk)
                  output.write(chunk)
          expected = os.environ["EXPECTED_DIGEST"]
          if expected != "sha256:" + digest.hexdigest():
              raise SystemExit("downloaded verification artifact digest differs from the API record")
          with zipfile.ZipFile(archive_path) as archive:
              seen = set()
              total = 0
              for info in archive.infolist():
                  name = info.filename
                  path = PurePosixPath(name)
                  mode = info.external_attr >> 16
                  file_type = stat.S_IFMT(mode)
                  normalized = path.as_posix().rstrip("/")
                  if (normalized in seen or path.is_absolute() or "\\" in name
                          or any(part in ("", ".", "..") for part in path.parts)
                          or stat.S_ISLNK(mode) or file_type not in (0, stat.S_IFREG, stat.S_IFDIR)):
                      raise SystemExit("verification artifact contains an unsafe or duplicate path")
                  seen.add(normalized)
                  total += info.file_size
                  if total > 4_000_000_000:
                      raise SystemExit("verification artifact expands beyond the allowed size")
              for info in archive.infolist():
                  path = PurePosixPath(info.filename)
                  target = Path("evidence/runtime")
                  for part in path.parts:
                      target /= part
                      if target.exists() and target.is_symlink():
                          raise SystemExit("verification artifact extraction encountered a symlink")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(info) as source, target.open("xb") as output:
                          while chunk := source.read(1024 * 1024):
                              output.write(chunk)
          PY

      - name: Load the three verified images without rebuilding
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker load --input evidence/runtime/release-images.tar
          for role in app worker ssr; do
            case "$role" in
              app) id_file=evidence/runtime/prod.id ;;
              worker) id_file=evidence/runtime/prod-worker.id ;;
              ssr) id_file=evidence/runtime/prod-ssr.id ;;
            esac
            image_id="$(cat "$id_file")"
            docker image inspect "$image_id" >/dev/null
          done

      - name: Create source archive and verify notices against the imported images
        id: source
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/output
          app_image="$(cat evidence/runtime/prod.id)"
          docker run --pull=never --rm --network none --read-only --entrypoint cat \
            "$app_image" /app/data/build/release.json > "$RUNNER_TEMP/release.json"
          python3 bin/prepare-notice-sources.py --output-dir "$RUNNER_TEMP/third-party-sources"
          python3 - "$CANDIDATE_SHA" "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/third-party-sources" evidence/output/source.tar.gz <<'PY'
          import json
          import os
          import re
          from pathlib import Path, PurePosixPath
          import subprocess
          import sys
          import tarfile

          sha, metadata, sources, output = sys.argv[1:]
          release = json.loads(Path(metadata).read_text(encoding="utf-8"))
          version = release.get("version") if isinstance(release, dict) else None
          revision = release.get("sha") if isinstance(release, dict) else None
          if (not isinstance(release, dict)
                  or release.get("dirty") is not False
                  or not isinstance(revision, str)
                  or not re.fullmatch(r"[a-f0-9]{7,40}", revision)
                  or not sha.startswith(revision)
                  or not isinstance(version, str)
                  or not re.fullmatch(
                      r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
                      r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
                      r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", version)):
              raise SystemExit("verified image release metadata is dirty or does not bind the candidate SHA and version")
          source = Path(sources)
          base = Path("evidence/output/source-base.tar")
          with base.open("xb") as stream:
              subprocess.run(["git", "archive", "--format=tar", sha], stdout=stream, check=True)
          supplements = {"data/build/release.json": Path(metadata)}
          for path in sorted(source.rglob("*")):
              if path.is_symlink():
                  raise SystemExit("source payload tree contains a symlink")
              if path.is_file():
                  supplements[path.relative_to(source.parent).as_posix()] = path
          destination = Path(output)
          with tarfile.open(base, "r:") as original, tarfile.open(destination, "w:gz", compresslevel=9) as result:
              replaced = set(supplements)
              for member in original:
                  if member.name in replaced or any(member.name.startswith(name.rstrip("/") + "/") for name in replaced):
                      continue
                  source_stream = original.extractfile(member) if member.isfile() else None
                  result.addfile(member, source_stream)
              for name, path in supplements.items():
                  info = tarfile.TarInfo(name)
                  info.size = path.stat().st_size
                  info.mode = 0o644
                  info.mtime = 0
                  with path.open("rb") as stream:
                      result.addfile(info, stream)
          base.unlink()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write("version=" + release["version"] + "\n")
              output_file.write("docker_tag=" + release["version"].replace("+", "-") + "\n")
          PY
          mkdir -p evidence/logs
          python3 test/Support/Release/notices.test.py \
            --app-image "$(cat evidence/runtime/prod.id)" \
            --worker-image "$(cat evidence/runtime/prod-worker.id)" \
            --ssr-image "$(cat evidence/runtime/prod-ssr.id)" \
            --source-archive evidence/output/source.tar.gz 2>&1 | tee evidence/logs/notices.log
          python3 test/Support/Release/notices.test.py --source-archive-only \
            --source-archive evidence/output/source.tar.gz 2>&1 | tee evidence/logs/notices-source.log
          python3 -c 'from pathlib import Path; p=Path("docs/operations/backup-restore.md"); assert p.is_file() and p.stat().st_size > 0; print("backup/restore runbook is present in the candidate checkout")' \
            2>&1 | tee evidence/logs/backup-runbook-checkout.log
          python3 - evidence/output/source.tar.gz 2>&1 <<'PY' | tee evidence/logs/backup-runbook-archive.log
          import sys, tarfile
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              item = archive.getmember("docs/operations/backup-restore.md")
              assert item.isfile() and item.size > 0
          print("backup/restore runbook is present in the candidate source archive")
          PY

      - name: Prepare complete local preview manifest
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile

          root = Path("evidence")
          output = root / "output"
          snapshot_path = Path(os.environ["RUNNER_TEMP"], "release-preflight.json")
          snapshot_data = snapshot_path.read_bytes()
          snapshot_ref = {"path": "release-preflight.json", "sha256": hashlib.sha256(snapshot_data).hexdigest()}
          snapshot = json.loads(snapshot_data)
          sha = os.environ["CANDIDATE_SHA"]
          version = os.environ["VERSION"]
          roles = {"app": "prod.id", "worker": "prod-worker.id", "ssr": "prod-ssr.id"}
          ids = {role: (root / "runtime" / filename).read_text().strip() for role, filename in roles.items()}
          report = json.loads((root / "runtime/report.json").read_text())
          product = json.loads((root / "runtime/product-report.json").read_text())
          image_export = root / "runtime/release-images.tar"
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          def write_json(path, value):
              data = (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode()
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              return {"path": path, "sha256": hashlib.sha256(data).hexdigest()}
          api_ref = write_json("reports/verify-api.json", snapshot)
          local_commands = []
          checks = {}
          def provider(name, results, producer=None, with_artifact=False):
              summary = {"provider": "github_actions", "candidate_sha": sha, "image_ids": ids, "results": results}
              if producer:
                  summary["producer_report"] = producer
              report_ref = write_json(f"reports/{name}.json", summary)
              row = {"provider": "github_actions", "candidate_sha": sha, "image_ids": ids,
                     "results": results, "report": report_ref,
                     "github": {"run_id": snapshot["run"]["id"], "api_response": api_ref}}
              if producer:
                  row["producer_report"] = producer
              if with_artifact:
                  row["github"]["artifact"] = {"name": "verified-runtime-images",
                      "download": {"path": "verified-runtime-images.zip",
                                   "sha256": digest(root / "verified-runtime-images.zip")}}
              checks[name] = row
          producer_ref = lambda path: {"path": path, "sha256": digest(root / path)}
          for name, results, producer_path, artifact in [
              ("backend", {"composer_check": "passed", "concurrency": "passed"}, None, False),
              ("tools", {"tools": "passed"}, None, False),
              ("frontend", {"npm_check": "passed", "ssr_build": "passed", "browser": "passed"}, None, False),
              ("images", {"result": "passed"}, "runtime/report.json", True),
              ("cold_worker", {"cold_worker": "passed"}, None, False),
              ("services", {"services": "passed"}, None, False),
              ("proxy", {"proxy": "passed"}, None, False),
              ("product", {"result": "passed"}, "runtime/product-report.json", True),
              ("audits", {"root": "passed", "tools": "passed", "frontend": "passed"}, None, False),
              ("history", {"history": "passed"}, None, False),
              ("onboarding", {"onboarding": "passed"}, "runtime/product-report.json", True),
          ]:
              provider(name, results, producer_ref(producer_path) if producer_path else None, artifact)

          def record_local(name, results, commands, report_extra=None):
              recorded = []
              for argv, log_name in commands:
                  log = root / "logs" / log_name
                  if not log.is_file():
                      raise SystemExit("missing native check log: " + log_name)
                  recorded.append({"argv": argv, "exit_code": 0,
                                   "log": {"path": "logs/" + log.name, "sha256": digest(log)}})
              summary = {"candidate_sha": sha, "image_ids": ids, "results": results,
                         "commands": recorded}
              ref = write_json(f"reports/{name}.json", {**summary, **(report_extra or {})})
              checks[name] = {**summary, "exit_code": 0, "report": ref}

          source = output / "source.tar.gz"
          source_sha256 = digest(source)
          with tarfile.open(source, "r:gz") as archive:
              names = {item.name for item in archive.getmembers() if item.isfile()}
          if "docs/operations/backup-restore.md" not in names:
              raise SystemExit("source archive omits the documented backup/restore runbook")
          record_local("notices", {"notices": "passed"}, [
              (["python3", "test/Support/Release/notices.test.py", "--app-image", ids["app"],
                "--worker-image", ids["worker"], "--ssr-image", ids["ssr"],
                "--source-archive", "evidence/output/source.tar.gz"], "notices.log"),
              (["python3", "test/Support/Release/notices.test.py", "--source-archive-only",
                "--source-archive", "evidence/output/source.tar.gz"], "notices-source.log"),
          ], {"source_archive_sha256": source_sha256})
          record_local("backup_runbook", {"backup_runbook": "passed"}, [
              (["python3", "-c", "from pathlib import Path; p=Path(\"docs/operations/backup-restore.md\"); assert p.is_file() and p.stat().st_size > 0; print(\"backup/restore runbook is present in the candidate checkout\")"], "backup-runbook-checkout.log"),
              (["python3", "-", "evidence/output/source.tar.gz"], "backup-runbook-archive.log"),
          ])

          with tarfile.open(image_export, "r:") as archive:
              index = json.load(archive.extractfile("index.json"))
              for role, image_id in ids.items():
                  matches = [item for item in index["manifests"] if item.get("digest") == image_id]
                  if len(matches) != 1:
                      raise SystemExit("OCI archive does not contain the reported " + role + " image ID")
                  payload = json.load(archive.extractfile("blobs/sha256/" + image_id.split(":", 1)[1]))
                  descriptors = payload.get("manifests", [])
                  runtime = [item for item in descriptors if item.get("platform", {}).get("os") == "linux"
                             and item.get("platform", {}).get("architecture") == "amd64"]
                  if len(runtime) != 1:
                      raise SystemExit("OCI archive has no unique linux/amd64 image for " + role)
                  manifest = json.load(archive.extractfile("blobs/sha256/" + runtime[0]["digest"].split(":", 1)[1]))
                  config_digest = manifest["config"]["digest"]
                  layers = [item["digest"] for item in manifest["layers"]]
                  d3 = report["images"][role]
                  if d3.get("id") != image_id or d3.get("base_digests") is None:
                      raise SystemExit("D3 report does not bind the exact " + role + " OCI image")
                  ids[role] = image_id
                  report.setdefault("_release_image", {})[role] = {
                      "config_digest": config_digest, "layer_digests": layers,
                      "base_digests": d3["base_digests"]}
          export_ref = {"path": "runtime/release-images.tar", "sha256": digest(image_export)}
          images = {role: {"local_id": image_id,
                           "config_digest": report["_release_image"][role]["config_digest"],
                           "export": export_ref,
                           "base_digests": report["_release_image"][role]["base_digests"],
                           "layer_digests": report["_release_image"][role]["layer_digests"]}
                    for role, image_id in ids.items()}
          source_ref = {"path": "output/source.tar.gz", "sha256": digest(source), "candidate_sha": sha}
          index = {"schema_version": 1, "candidate_sha": sha, "support_revision": sha,
                   "version": version, "level": "preview", "images": images, "checks": checks,
                   "source_archive": source_ref}
          write_json("release-evidence.json", index)
          PY
          mkdir -p bundle
          python3 bin/prepare-release.py --level preview --candidate-sha "$CANDIDATE_SHA" \
            --version "$VERSION" --evidence-dir evidence --output-dir bundle
          (cd bundle && sha256sum --check SHA256SUMS)
          cat bundle/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          runtime_artifact_sha="$(sha256sum evidence/verified-runtime-images.zip | cut -d ' ' -f 1)"
          printf 'Candidate: `%s`  \nVersion: `%s`  \nRuntime artifact SHA-256: `%s`\n\n' \
            "$CANDIDATE_SHA" "$VERSION" "$runtime_artifact_sha" >> "$GITHUB_STEP_SUMMARY"
          printf 'Docker namespace: `%s`  \nDocker tag encoding: `%s`\n\n' \
            "$DOCKERHUB_NAMESPACE" "${VERSION//+/-}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: packio-preview-bundle
          path: bundle/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Bind the owner review to the uploaded bundle digest
        env:
          BUNDLE_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_DIGEST"
          printf 'Uploaded review artifact digest: `%s`\n' "$BUNDLE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  owner-approval:
    name: Owner review for ${{ needs.prepare.outputs.version }} at ${{ needs.prepare.outputs.candidate_sha }}
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: release-approval
      deployment: false
    permissions:
      actions: read
    env:
      RELEASE_OWNER_LOGIN: ${{ vars.RELEASE_OWNER_LOGIN }}
      EXPECTED_BUNDLE_DIGEST: ${{ needs.prepare.outputs.bundle_digest }}
    steps:
      - name: Verify the owner approved this exact prepared workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api = os.environ["GH_API_URL"].rstrip("/")
          repo = os.environ["GH_REPOSITORY"]
          run_id = os.environ["GH_RUN_ID"]
          owner = os.environ["RELEASE_OWNER_LOGIN"]
          expected_digest = os.environ["EXPECTED_BUNDLE_DIGEST"]
          url = f"{api}/repos/{repo}/actions/runs/{run_id}/approvals"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              approvals = json.load(response)
          artifacts_url = f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          artifact_request = urllib.request.Request(artifacts_url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(artifact_request, timeout=30) as response:
              artifacts = json.load(response).get("artifacts", [])
          bundle = [item for item in artifacts if item.get("name") == "packio-preview-bundle"]
          if (len(bundle) != 1 or bundle[0].get("expired") is not False
                  or bundle[0].get("digest") != expected_digest):
              raise SystemExit("the uploaded bundle artifact changed or expired before owner review")
          if not any(item.get("state") == "approved" and item.get("user", {}).get("login", "").casefold() == owner.casefold()
                     for item in approvals):
              raise SystemExit("the configured release owner has not approved this exact bundle preparation run")
          print("The configured release owner approved this exact workflow run; no publication was performed.")
          PY
