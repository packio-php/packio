name: Public verification

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan checkout and selected publication history
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen refs and scan with pinned native Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          chmod 700 "$work_dir"
          trap 'rm -rf -- "$work_dir"' EXIT

          archive="$work_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --status || {
            echo '::error::Gitleaks archive integrity verification failed'
            exit 1
          }
          tar -xzf "$archive" -C "$work_dir" gitleaks
          scanner="$work_dir/gitleaks"
          chmod 700 "$scanner"
          printf '%s  %s\n' '88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509' "$scanner" | sha256sum --check --status || {
            echo '::error::Gitleaks binary integrity verification failed'
            exit 1
          }
          scanner_version="$(env -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML "$scanner" --no-banner --no-color version 2>/dev/null)" || {
            echo '::error::Gitleaks execution failed'
            exit 1
          }
          if [ "$scanner_version" != '8.30.1' ]; then
            echo '::error::Unexpected Gitleaks version'
            exit 1
          fi

          cat > "$work_dir/gitleaks.toml" <<'GITLEAKS_CONFIG'
          [extend]
          useDefault = true

          [[rules]]
          id = "generic-api-key"

          # The next two files are deleted but remain in the scanned history.
          [[rules.allowlists]]
          condition = "AND"
          regexTarget = "secret"
          paths = ['''^(\./)?compose\.runtime-smoke\.yaml$''']
          regexes = ['''^(0123456789abcdef){4}$''']

          [[rules.allowlists]]
          condition = "AND"
          regexTarget = "secret"
          paths = ['''^(\./)?test/Support/Release/dependencies\.test\.py$''']
          regexes = ['''^(0123456789abcdef){4}$''']

          [[rules.allowlists]]
          condition = "AND"
          regexTarget = "secret"
          paths = ['''^(\./)?test/Support/Release/image\.test\.py$''']
          regexes = ['''^(0123456789abcdef){4}$''']

          [[rules.allowlists]]
          condition = "AND"
          regexTarget = "secret"
          paths = ['''^(\./)?test/Unit/Source/Infrastructure/Request/ProviderAuthorizationOAuthRequestTest\.php$''']
          regexes = ['''^0196f38d-3c8c-73d0-b184-e624de30bdf2$''']
          GITLEAKS_CONFIG
          : > "$work_dir/empty-ignore"

          if [ "$(git rev-parse --is-shallow-repository)" != 'false' ]; then
            echo '::error::full Git history is required; scan not run'
            exit 1
          fi
          {
            if git rev-parse --verify --quiet 'refs/remotes/origin/main^{commit}' > /dev/null; then
              echo refs/remotes/origin/main
            fi
            git for-each-ref --format='%(refname)' refs/tags
            echo HEAD
          } > "$work_dir/scan-refs"
          history_refs="$(paste -sd ' ' "$work_dir/scan-refs")"
          scan() {
            local scope="$1"
            shift
            local report="$work_dir/$scope.json"
            local status=0
            if env -u GITLEAKS_CONFIG -u GITLEAKS_CONFIG_TOML "$scanner" \
              --no-banner --no-color --log-level error --redact=100 \
              --ignore-gitleaks-allow --gitleaks-ignore-path "$work_dir/empty-ignore" \
              --config "$work_dir/gitleaks.toml" --report-format json --report-path "$report" \
              --timeout 900 "$@" > "$work_dir/$scope.log" 2>&1; then
              status=0
            else
              status=$?
            fi
            if [ ! -f "$report" ] || ! jq -e 'if type == "array" then length else error("not a list") end' "$report" > "$work_dir/$scope.count" 2> "$work_dir/$scope.parse.log"; then
              echo "::error::$scope scan failed or did not produce a valid private report (exit $status)"
              return 1
            fi
            local count
            count="$(cat "$work_dir/$scope.count")"
            if [ "$status" -ne 0 ] || [ "$count" -ne 0 ]; then
              echo "::error::$scope scan failed (exit $status, findings $count); report remains private"
              return 1
            fi
          }
          scan checkout dir .
          scan history git --log-opts="--root --full-history -m $history_refs" .
          echo 'Gitleaks 8.30.1 checkout and selected-history scans passed.'
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [base, concurrency]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: packio_test
          POSTGRES_USER: packio_test
          POSTGRES_PASSWORD: packio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packio_test -d packio_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PACKIO_TEST_RUNNER_MODE: ci
      PACKIO_TEST_DATABASE_HOST: 127.0.0.1
      PACKIO_TEST_DATABASE_PORT: '5432'
      PACKIO_TEST_DATABASE_NAME: packio_test
      PACKIO_TEST_DATABASE_USER: packio_test
      PACKIO_TEST_DATABASE_PASS: packio_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, filter, iconv, mbstring, openssl, pcntl, pdo_pgsql, posix, session, simplexml, sockets, sodium, xmlwriter
          coverage: none
          tools: composer:v2
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict && composer check-platform-reqs && composer audit --locked
      - name: Validate and audit locked tools
        run: |
          set -eu
          for manifest in tools/*/composer.json; do
            tool=$(dirname "$manifest")
            composer --working-dir="$tool" validate --no-check-publish
            composer --working-dir="$tool" install --no-interaction --prefer-dist --no-progress
            composer --working-dir="$tool" check-platform-reqs
            composer --working-dir="$tool" audit --locked
          done
      - if: matrix.suite == 'base'
        run: composer check && composer openapi-check && sh test/Support/Docs/links.test.sh && sh test/Support/Compose/dev-compose.test.sh && sh test/Support/Compose/deploy-compose.test.sh && sh test/Support/Release/image-tags.test.sh
      - if: matrix.suite == 'concurrency'
        run: composer test:concurrency

  frontend:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --version && npm --version && npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high && npm ls
      - run: npm run check
      - run: npm run openapi-assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports
          path: |
            data/coverage/vitest.junit.xml
            test-results/
            playwright-report/
          if-no-files-found: error

  runtime:
    name: Runtime images and private Composer product
    # Heavy end-to-end image check (~25 min): manual runs and release tags only.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, filter, iconv, mbstring, openssl, pcntl, pdo_pgsql, posix, session, simplexml, sockets, sodium, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      # The product step mounts node_modules into its browser container.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Preserve image provenance in the disposable Docker store
        uses: docker/setup-docker-action@v5
        with:
          version: v29.9.0
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Require Docker and verify production images, layers and startup
        run: |
          set -eu
          candidate_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          case "$candidate_sha" in
            *[!0-9a-f]*|'') echo 'Expected a full candidate commit SHA' >&2; exit 1 ;;
          esac
          [ "${#candidate_sha}" -eq 40 ] || { echo 'Expected a full candidate commit SHA' >&2; exit 1; }
          metadata_file="$RUNNER_TEMP/release.json"
          php bin/generate-release-metadata.php --output="$metadata_file"
          release_version="$(php -r '$metadata=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); if (!is_array($metadata) || !is_string($metadata["sha"] ?? null) || !str_starts_with($argv[2], $metadata["sha"]) || ($metadata["dirty"] ?? true) !== false || !is_string($metadata["version"] ?? null)) { fwrite(STDERR, "Release metadata does not match the clean candidate checkout.\\n"); exit(1); } echo $metadata["version"];' "$metadata_file" "$candidate_sha")"
          printf 'PACKIO_CANDIDATE_SHA=%s\nPACKIO_RELEASE_VERSION=%s\n' "$candidate_sha" "$release_version" >> "$GITHUB_ENV"
          docker info
          docker compose version
          docker pull postgres:17-alpine
          mkdir -p data/coverage/images
          docker_version="${release_version//+/-}"
          for target in prod prod-worker prod-ssr; do
            local_tag="packio-local-${target}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:${docker_version}"
            if docker image inspect "$local_tag" >/dev/null 2>&1; then
              echo "Refusing to replace existing local image reference: $local_tag" >&2
              exit 1
            fi
          done
          for target in prod prod-worker prod-ssr; do
            local_tag="packio-local-${target}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:${docker_version}"
            docker build --provenance=true -f .docker/Dockerfile.roadrunner --target "$target" \
              --tag "$local_tag" \
              --label "org.opencontainers.image.source=https://github.com/packio-php/packio" \
              --label "org.opencontainers.image.revision=$candidate_sha" \
              --label "org.opencontainers.image.version=$release_version" \
              --label "org.opencontainers.image.licenses=MIT" \
              --iidfile "data/coverage/images/$target.id" \
              --metadata-file "data/coverage/images/$target.build.json" .
          done
          app_image=$(cat data/coverage/images/prod.id)
          worker_image=$(cat data/coverage/images/prod-worker.id)
          ssr_image=$(cat data/coverage/images/prod-ssr.id)
          python3 test/Support/Release/image.test.py --verify-only \
            --app-image "$app_image" --worker-image "$worker_image" --ssr-image "$ssr_image" \
            --expected-sha "$candidate_sha" --report data/coverage/images/report.json
          sh test/Support/Release/notices.test.sh "$app_image" "$worker_image" "$ssr_image"
          sh test/Support/RoadRunner/cold-worker.test.sh "$worker_image"
          sh test/Support/RoadRunner/services.test.sh "$worker_image"
          docker save -o data/coverage/images/release-images.tar "$app_image" "$worker_image" "$ssr_image"
      - name: Require private Composer install, tenant isolation and the documented edge on the same images
        run: |
          sh test/Support/Release/product.test.sh "$(cat data/coverage/images/prod.id)" \
            "$(cat data/coverage/images/prod-worker.id)" "$(cat data/coverage/images/prod-ssr.id)"
      - name: Start the deploy Compose files on the built images
        run: |
          set -eu
          for pair in prod:packio prod-worker:packio-worker prod-ssr:packio-ssr; do
            docker tag "$(cat "data/coverage/images/${pair%%:*}.id")" "ghcr.io/packio-php/${pair#*:}:ci"
          done
          # Only the Packio images exist locally; everything else is pulled here, so compose may never pull.
          docker pull postgres:17-alpine
          docker pull axllent/mailpit
          work="$RUNNER_TEMP/deploy"
          rm -rf "$work"
          cp -r deploy "$work"
          cd "$work"
          cp .env.local.example .env
          sed -i 's/^PACKIO_VERSION=.*/PACKIO_VERSION=ci/' .env
          trap 'docker compose down -v --remove-orphans' EXIT
          for files in compose.yaml:compose.local.yaml compose.yaml:compose.local.yaml:compose.ssr.yaml; do
            echo "::group::$files"
            export COMPOSE_FILE="$files"
            if ! docker compose up -d --pull never --wait --wait-timeout 300; then
              echo "::endgroup::"
              docker compose logs
              exit 1
            fi
            base=http://packio.localhost:8080
            resolve='--resolve packio.localhost:8080:127.0.0.1'
            ok=true
            curl -fsS $resolve "$base/health" || ok=false
            curl -sS $resolve -D headers.txt -o login.html "$base/auth/login" || ok=false
            command grep -qi '^HTTP/[0-9.]* 200' headers.txt || { echo "login page did not answer 200"; ok=false; }
            if command grep -i '^set-cookie:.*;[[:space:]]*secure' headers.txt; then
              echo "a Secure cookie would break the plain-HTTP local variant"
              ok=false
            fi
            case "$files" in
              *compose.ssr.yaml)
                command grep -Eiq '<input\b[^>]*type="email"' login.html || { echo "login page was not server-rendered"; ok=false; } ;;
            esac
            command grep -qi '^set-cookie: PACKIO_SESSID=' headers.txt || { echo "no session cookie was set"; ok=false; }
            if [ "$ok" != true ]; then
              echo "::endgroup::"
              docker compose logs
              exit 1
            fi
            docker compose down -v --remove-orphans
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-runtime-images
          path: data/coverage/images/
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish verified images to GHCR
    # Pushes the images the runtime job already verified; never rebuilds. Runs only if every other job passed.
    needs: [secret-scan, backend, frontend, runtime]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compute image tags
        id: tags
        run: |
          status=0
          tags="$(sh .github/scripts/image-tags.sh "$GITHUB_REF")" || status=$?
          case "$status" in
            0) printf 'tags=%s\npublish=true\n' "$tags" >> "$GITHUB_OUTPUT" ;;
            1) echo 'not a release tag, nothing to publish' ;;
            *) exit "$status" ;;
          esac
      - name: Use the same Docker image store as the runtime job
        if: steps.tags.outputs.publish == 'true'
        uses: docker/setup-docker-action@v5
        with:
          version: v29.9.0
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Download the verified images
        if: steps.tags.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: verified-runtime-images
          path: verified-images
      - name: Load, tag and push the verified images
        if: steps.tags.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          docker load -i verified-images/release-images.tar
          version="${TAGS%% *}"
          pairs="prod:ghcr.io/packio-php/packio prod-worker:ghcr.io/packio-php/packio-worker prod-ssr:ghcr.io/packio-php/packio-ssr"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          # Sets lookup_status (HTTP status of the manifest request, or "denied") and lookup_digest. Fails the job
          # on anything inconclusive. 401/403 count as "not published": a package that does not exist yet answers
          # "denied", and these are the credentials the push uses, so if access is really broken the push fails
          # too and nothing is replaced.
          lookup() {
            repo="${1#ghcr.io/}"
            lookup_digest=''
            code="$(curl --silent --show-error --retry 3 ${REGISTRY_USER:+-u "$REGISTRY_USER:$REGISTRY_TOKEN"} \
              --output "$RUNNER_TEMP/token.json" --write-out '%{http_code}' \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull")" || code=curl-error
            case "$code" in
              200) ;;
              401|403) lookup_status=denied; echo "::notice::$repo: registry denied the pull token; treating $2 as not published"; return ;;
              *) echo "::error::$repo: token request failed (status $code); cannot tell whether $2 is published"; exit 1 ;;
            esac
            token="$(jq -r .token "$RUNNER_TEMP/token.json")"
            [ -n "$token" ] && [ "$token" != null ] || { echo "::error::$repo: token response had no token; cannot tell whether $2 is published"; exit 1; }
            code="$(curl --silent --show-error --retry 3 --head --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              --dump-header "$RUNNER_TEMP/headers.txt" --output /dev/null --write-out '%{http_code}' \
              "https://ghcr.io/v2/$repo/manifests/$2")" || code=curl-error
            lookup_status="$code"
            case "$code" in
              200)
                lookup_digest="$(awk 'tolower($1) == "docker-content-digest:" { print $2 }' "$RUNNER_TEMP/headers.txt" | tr -d '\r')"
                [ -n "$lookup_digest" ] || { echo "::error::$repo:$2 exists but the registry sent no digest"; exit 1; } ;;
              404) ;;
              401|403) echo "::notice::$repo: registry denied the manifest request; treating $2 as not published" ;;
              *) echo "::error::$repo:$2 lookup failed (status $code); cannot tell whether it is published"; exit 1 ;;
            esac
          }
          # Check everything before pushing anything: a published version must never be replaced.
          for pair in $pairs; do
            id="$(cat "verified-images/${pair%%:*}.id")"
            name="${pair#*:}"
            label="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$id")"
            if [ "$label" != "$version" ]; then
              echo "::error::$name image is labeled version '$label', expected '$version'"
              exit 1
            fi
            lookup "$name" "$version"
            if [ -n "$lookup_digest" ] && [ "$lookup_digest" != "$id" ]; then
              echo "::error::$name:$version is already published with different content; refusing to replace it (published $lookup_digest, local $id)"
              exit 1
            fi
          done
          {
            echo '| Image | Tags | Digest |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in $pairs; do
            id="$(cat "verified-images/${pair%%:*}.id")"
            name="${pair#*:}"
            # Exact version first, latest last: an interrupted run never leaves latest ahead of its version tag.
            for tag in $TAGS; do
              docker tag "$id" "$name:$tag"
              docker push "$name:$tag"
            done
            lookup "$name" "$version"
            [ "$lookup_status" = 200 ] || { echo "::error::$name:$version was not found after the push"; exit 1; }
            digest="$lookup_digest"
            echo "| \`$name\` | \`$TAGS\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done
